  <!-- ===== 展示更多：每段超过 3 个时自动折叠并显示按钮 ===== -->
  <script>
    document.querySelectorAll('.subsection').forEach(function (sec) {
      var grid = sec.querySelector('.grid');
      if (!grid) return;
      var cards = grid.querySelectorAll('.card');
      var LIMIT = 3;
      if (cards.length <= LIMIT) return;

      // 收起第 4 个及以后的卡片
      for (var i = LIMIT; i < cards.length; i++) {
        cards[i].classList.add('is-hidden');
      }

      // 生成按钮
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'show-more';
      btn.textContent = '展示更多 ↓';
      sec.appendChild(btn);

      btn.addEventListener('click', function () {
        var hidden = grid.querySelectorAll('.card.is-hidden');
        if (hidden.length > 0) {
          hidden.forEach(function (c) { c.classList.remove('is-hidden'); });
          btn.textContent = '收起 ↑';
        } else {
          for (var i = LIMIT; i < cards.length; i++) {
            cards[i].classList.add('is-hidden');
          }
          btn.textContent = '展示更多 ↓';
        }
      });
    });
  </script>
